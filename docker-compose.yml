# Nexview starten:  docker compose up -d
# Auf eine neue Version aktualisieren:  docker compose pull && docker compose up -d
#
# Auf der Synology laeuft das ueber Container Manager -> Projekt -> aus
# docker-compose.yml. Wichtig ist nur das Verzeichnis unter "volumes": dort
# liegen Datenbank, Verschluesselungsschluessel und Profilbilder. Ohne das
# waeren nach einem Update alle Konten und Einstellungen weg.

services:
  nexview:
    # Das fertige Abbild wird automatisch heruntergeladen - nichts zu bauen.
    image: ghcr.io/derkezorm/nexview:latest
    # Wer stattdessen selbst bauen will (z. B. nach eigenen Aenderungen),
    # ersetzt die Zeile darueber durch:  build: .
    container_name: nexview
    restart: unless-stopped

    ports:
      # Links der Port auf dem NAS, rechts der im Container. Ist 5173 belegt,
      # einfach die linke Zahl aendern - und die oeffentliche Adresse in den
      # Einstellungen mit anpassen.
      - "5173:8000"

    volumes:
      # Relativ zum Projektordner. Auf der Synology gern ein fester Pfad,
      # z. B. /volume1/docker/nexview/data:/data
      - ./data:/data

    environment:
      # Wem die Dateien im Datenverzeichnis gehoeren sollen. Der Container legt
      # die Rechte beim Start selbst richtig - es muss auf dem NAS also nichts
      # von Hand eingestellt werden. Nur wenn die Dateien einem bestimmten
      # Synology-Benutzer gehoeren sollen, hier dessen Nummern eintragen
      # (zu finden per SSH mit "id benutzername").
      PUID: 1000
      PGID: 1000

      # Schluessel fuer Login-Token und die Verschluesselung der API-Keys.
      # Leer lassen ist in Ordnung: Nexview legt beim ersten Start selbst einen
      # an und speichert ihn unter /data/secret.key. Wer ihn hier setzt, sollte
      # ihn NICHT ins Repo schreiben - dafuer gibt es die .env-Datei daneben.
      NEXVIEW_SECRET_KEY: ${NEXVIEW_SECRET_KEY:-}

      # Notausgang fuer die Protokoll-Stufe (quiet | normal | detailed | trace).
      # Leer lassen: Die Stufe wird in der App eingestellt und schaltet sich
      # nach der Fehlersuche von allein wieder zurueck. Nur setzen, wenn
      # Nexview gar nicht erst startet und man an keine Oberflaeche kommt.
      NEXVIEW_LOG_LEVEL: ${NEXVIEW_LOG_LEVEL:-}

      # Wie lange eine Anmeldung gilt.
      NEXVIEW_ACCESS_TOKEN_MINUTES: 30
      NEXVIEW_REFRESH_TOKEN_DAYS: 30

      # Zeitzone fuer Protokoll und Datumsangaben.
      TZ: Europe/Berlin

      # Auf welchem Port Nexview *im Container* lauscht. Braucht man nur beim
      # Host-Netzwerk-Betrieb: Dort gibt es keine Zuordnung wie oben, der Port
      # im Container ist dann direkt der Port des Servers - und wenn dort schon
      # etwas auf 8000 liegt, kommt Nexview gar nicht hoch. Sonst leer lassen.
      # NEXVIEW_PORT: 8123

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
