<!-- @dsCard group="Farben" viewport="760x210" name="Flächen — die ink-Rampe" subtitle="Seite, Karte, Hover, Rahmen — sechs Stufen, jede mit genau einer Aufgabe" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--surface-page);color:var(--text-secondary);
       font-family:var(--font-sans);font-size:var(--size-sm);overflow:hidden}
  .reihe{display:flex;gap:10px}
  .feld{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .platte{height:56px;border-radius:var(--radius-lg);border:1px solid var(--border-default)}
  .name{font-family:var(--font-mono);font-size:var(--size-xs);color:var(--text-body);white-space:nowrap}
  .wert{font-family:var(--font-mono);font-size:var(--size-2xs);color:var(--text-faint)}
  .rolle{font-size:var(--size-2xs);color:var(--text-dim);line-height:1.3}
</style>
</head><body>
<div class="reihe">
  <div class="feld"><span class="platte" style="background:var(--color-ink-950)"></span>
    <span class="name">ink-950</span><span class="wert">#0b0b0f</span><span class="rolle">Seite</span></div>
  <div class="feld"><span class="platte" style="background:var(--color-ink-900)"></span>
    <span class="name">ink-900</span><span class="wert">#101016</span><span class="rolle">Eingabefelder</span></div>
  <div class="feld"><span class="platte" style="background:var(--color-ink-850)"></span>
    <span class="name">ink-850</span><span class="wert">#16161d</span><span class="rolle">Karten</span></div>
  <div class="feld"><span class="platte" style="background:var(--color-ink-800)"></span>
    <span class="name">ink-800</span><span class="wert">#1d1d26</span><span class="rolle">Karte im Hover</span></div>
  <div class="feld"><span class="platte" style="background:var(--color-ink-700)"></span>
    <span class="name">ink-700</span><span class="wert">#26262f</span><span class="rolle">Rahmen</span></div>
  <div class="feld"><span class="platte" style="background:var(--color-ink-600)"></span>
    <span class="name">ink-600</span><span class="wert">#3a3a46</span><span class="rolle">Rahmen, betont</span></div>
</div>
</body></html>
