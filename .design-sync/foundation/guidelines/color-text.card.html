<!-- @dsCard group="Farben" viewport="760x230" name="Text — die mist-Rampe" subtitle="Vier Lautstärken, und mist-600 ist die leiseste, die noch lesbar ist" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--surface-page);font-family:var(--font-sans);overflow:hidden}
  .zeile{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-default)}
  .zeile:last-child{border-bottom:0}
  .name{font-family:var(--font-mono);font-size:var(--size-xs);width:6.5rem;flex:none;color:var(--text-faint)}
  .wert{font-family:var(--font-mono);font-size:var(--size-2xs);width:5rem;flex:none;color:var(--text-faint)}
  .probe{font-size:var(--size-sm);flex:1;min-width:0}
  .rolle{font-size:var(--size-2xs);color:var(--text-dim);width:11rem;flex:none;text-align:right}
</style>
</head><body>
<div class="zeile"><span class="name">mist-100</span><span class="wert">#f2f2f5</span>
  <span class="probe" style="color:var(--color-mist-100)">Tage des Donners</span>
  <span class="rolle">Titel, Fließtext</span></div>
<div class="zeile"><span class="name">mist-300</span><span class="wert">#c3c3ce</span>
  <span class="probe" style="color:var(--color-mist-300)">Bereits in der Bibliothek</span>
  <span class="rolle">Zweite Ebene</span></div>
<div class="zeile"><span class="name">mist-500</span><span class="wert">#9a9aa8</span>
  <span class="probe" style="color:var(--color-mist-500)">Angefragt am 12. August</span>
  <span class="rolle">Gedimmt, Beiwerk</span></div>
<div class="zeile"><span class="name">mist-600</span><span class="wert">#6f6f80</span>
  <span class="probe" style="color:var(--color-mist-600)">Kein Ergebnis</span>
  <span class="rolle">Leerzustand, Platzhalter</span></div>
</body></html>
