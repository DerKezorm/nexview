# Baut bei jeder Änderung an main ein fertiges Docker-Abbild und legt es in
# der GitHub Container Registry ab. Damit muss niemand mehr selbst bauen -
# auf dem NAS genügt dann "docker compose pull".
name: Docker-Abbild bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Ermöglicht das Bauen von Hand über den Reiter "Actions".
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Immer nur ein Lauf gleichzeitig.
#
# Beim ersten Versuch scheiterte der Bau daran, dass ein Push auf main und ein
# Tag in derselben Sekunde starteten: beide holten dieselben Bausteine, und
# GitHub wehrte den zweiten mit "429 Too Many Requests" ab. Laufende Laeufe
# werden bewusst *nicht* abgebrochen - ein halb veroeffentlichtes Abbild waere
# schlimmer als ein paar Minuten Wartezeit.
concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        working-directory: backend
        run: python -m pytest -q

      # Bei einer Veroeffentlichung muss die Nummer im Code zum Tag passen.
      # Sonst zeigt die Ueber-Seite spaeter eine andere Version an als die,
      # die tatsaechlich installiert ist - und die Update-Pruefung meldet
      # entweder dauerhaft ein Update oder gar keins mehr.
      - name: Version gegen Tag prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        run: |
          IM_CODE=$(python -c "import app; print(app.__version__)")
          AM_TAG="${GITHUB_REF_NAME#v}"
          echo "Code: $IM_CODE / Tag: $AM_TAG"
          if [ "$IM_CODE" != "$AM_TAG" ]; then
            echo "::error::app/__init__.py sagt $IM_CODE, der Tag sagt $AM_TAG."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend prüfen und bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

  image:
    name: Abbild bauen
    runs-on: ubuntu-latest
    # Erst bauen, wenn die Tests durch sind - ein kaputtes Abbild hilft niemandem.
    needs: tests
    # Bei Pull Requests nur bauen, nicht veröffentlichen.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Nötig für den Bau für mehrere Prozessorarchitekturen: Synology-Geräte
      # gibt es sowohl mit Intel/AMD als auch mit ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Namen und Etiketten bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # "latest" haengt bewusst am Tag, nicht am Branch: wer in seiner
          # compose-Datei "latest" stehen hat, bekommt beim naechsten "pull"
          # eine veroeffentlichte Version - und nicht den Zwischenstand von
          # gerade eben. Der aktuelle Entwicklungsstand liegt unter "main".
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Zwischenstände zwischen den Läufen behalten - spart die meiste Zeit.
          cache-from: type=gha
          cache-to: type=gha,mode=max
