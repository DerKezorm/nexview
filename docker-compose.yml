# Nexview starten:  docker compose up -d
# Auf eine neue Version aktualisieren:  docker compose pull && docker compose up -d
#
# Auf der Synology laeuft das ueber Container Manager -> Projekt -> aus
# docker-compose.yml. Wichtig ist nur das Verzeichnis unter "volumes": dort
# liegen Datenbank, Verschluesselungsschluessel und Profilbilder. Ohne das
# waeren nach einem Update alle Konten und Einstellungen weg.

services:
  nexview:
    # Das fertige Abbild wird automatisch heruntergeladen - nichts zu bauen.
    image: ghcr.io/derkezorm/nexview:latest
    # Wer stattdessen selbst bauen will (z. B. nach eigenen Aenderungen),
    # ersetzt die Zeile darueber durch:  build: .
    container_name: nexview
    restart: unless-stopped

    ports:
      # Links der Port auf dem NAS, rechts der im Container. Ist 5173 belegt,
      # einfach die linke Zahl aendern - und die oeffentliche Adresse in den
      # Einstellungen mit anpassen.
      - "5173:8000"

    volumes:
      # Relativ zum Projektordner. Auf der Synology gern ein fester Pfad,
      # z. B. /volume1/docker/nexview/data:/data
      - ./data:/data

    environment:
      # Wem die Dateien im Datenverzeichnis gehoeren sollen. Der Container legt
      # die Rechte beim Start selbst richtig - es muss auf dem NAS also nichts
      # von Hand eingestellt werden. Nur wenn die Dateien einem bestimmten
      # Synology-Benutzer gehoeren sollen, hier dessen Nummern eintragen
      # (zu finden per SSH mit "id benutzername").
      PUID: 1000
      PGID: 1000

      # Schluessel fuer Login-Token und die Verschluesselung der API-Keys.
      # Leer lassen ist in Ordnung: Nexview legt beim ersten Start selbst einen
      # an und speichert ihn unter /data/secret.key. Wer ihn hier setzt, sollte
      # ihn NICHT ins Repo schreiben - dafuer gibt es die .env-Datei daneben.
      NEXVIEW_SECRET_KEY: ${NEXVIEW_SECRET_KEY:-}

      # Notausgang fuer die Protokoll-Stufe (quiet | normal | detailed | trace).
      # Leer lassen: Die Stufe wird in der App eingestellt und schaltet sich
      # nach der Fehlersuche von allein wieder zurueck. Nur setzen, wenn
      # Nexview gar nicht erst startet und man an keine Oberflaeche kommt.
      NEXVIEW_LOG_LEVEL: ${NEXVIEW_LOG_LEVEL:-}

      # Wie lange eine Anmeldung gilt.
      NEXVIEW_ACCESS_TOKEN_MINUTES: 30
      NEXVIEW_REFRESH_TOKEN_DAYS: 30

      # Woher Nexview die Adresse des Anfragenden nimmt.
      #
      # Nach zu vielen Fehlversuchen bremst Nexview die Anmeldung. Gezaehlt
      # wird immer nach Konto - und zusaetzlich nach Adresse, sobald hier
      # steht, wie Nexview an die echte Adresse kommt.
      #
      #   leer      nur nach Konto zaehlen (Vorgabe, immer sicher)
      #   direct    Nexview haengt direkt am Netz
      #   proxy     genau ein Reverse Proxy davor (Nginx, Caddy, NPM, Traefik)
      #   proxy:2   zwei davor, z. B. Cloudflare und dahinter ein eigener
      #
      # ⚠️ Leer lassen, wenn unklar. Steht hier "direct", obwohl ein Proxy
      # davorsteht, sehen alle Anfragen aus wie dieselbe Adresse - dann
      # sperrt ein einziger Vertipper den ganzen Haushalt aus.
      NEXVIEW_CLIENT_IP: ${NEXVIEW_CLIENT_IP:-}

      # Ob das Anmelde-Cookie nur ueber HTTPS mitfahren darf (Secure).
      #
      #   auto      Secure, wenn die Anfrage ueber https kam (Vorgabe)
      #   on        immer erzwingen - fuer einen Proxy, der HTTPS abschliesst
      #             und intern schlichtes http weiterreicht
      #   off       nie setzen
      #
      # ⚠️ Nicht auf "on" stellen, wenn Nexview ueber http:// erreichbar sein
      # soll: Der Browser wirft ein Secure-Cookie ueber http weg, und dann
      # kommt niemand mehr hinein.
      NEXVIEW_COOKIE_SECURE: ${NEXVIEW_COOKIE_SECURE:-auto}

      # Unterpfad hinter einem Reverse Proxy, z. B. /nexview fuer
      # https://example.com/nexview/. Leer = Wurzel, alles wie bisher.
      # Proxy-Beispiele: README, "Behind a reverse proxy".
      NEXVIEW_URL_BASE: ${NEXVIEW_URL_BASE:-}
      # Emergency exit only: the username of the account that owns this
      # installation. Leave unset - the account from the setup wizard owns
      # it. Set it if the owner locks themselves out, restart once, then
      # remove it again. See README, "The owner account".
      NEXVIEW_BETREIBER: ${NEXVIEW_BETREIBER:-}

      # Inhaltsregeln der Seite: on | report-only | off
      NEXVIEW_CSP: ${NEXVIEW_CSP:-on}

      # Wer Nexview einrahmen darf: none | self | <Adresse>
      # ⚠️ Wer Nexview in einem Uebersichts-Brett eingebettet hat, braucht
      # hier "self" oder die Adresse des Bretts - sonst bleibt der Rahmen
      # leer, und zwar ohne Fehlermeldung.
      NEXVIEW_FRAME_ANCESTORS: ${NEXVIEW_FRAME_ANCESTORS:-none}

      # Zusaetzliche Bildquellen, mit Leerzeichen getrennt. Nur noetig, wenn
      # im Kalender die Poster leer bleiben.
      NEXVIEW_IMG_SOURCES: ${NEXVIEW_IMG_SOURCES:-}

      # Zeitzone fuer Protokoll und Datumsangaben.
      TZ: Europe/Berlin

      # Auf welchem Port Nexview *im Container* lauscht. Braucht man nur beim
      # Host-Netzwerk-Betrieb: Dort gibt es keine Zuordnung wie oben, der Port
      # im Container ist dann direkt der Port des Servers - und wenn dort schon
      # etwas auf 8000 liegt, kommt Nexview gar nicht hoch. Sonst leer lassen.
      # NEXVIEW_PORT: 8123

    healthcheck:
      # ⚠️ **Der Port muss aus NEXVIEW_PORT kommen, nicht fest hier stehen.**
      # Sonst prüft die Kontrolle die 8000, während Nexview im
      # Host-Netzwerk-Betrieb längst woanders lauscht - der Container läuft
      # dann einwandfrei und gilt trotzdem dauerhaft als "unhealthy". Die
      # Shell-Form ist nötig, weil Docker in der Listen-Form keine Variablen
      # einsetzt; das Abbild macht es in seinem eigenen HEALTHCHECK genauso.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${NEXVIEW_PORT:-8000}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
